<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <noscript>
    <meta http-equiv="refresh" content="15" />
  </noscript>
  <title>Quazaar Sync — Paused</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --amber: #f59e0b;
      --amber-bg: #fef3c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, #edf2f7 0%, transparent 70%),
        linear-gradient(to right, rgba(0, 0, 0, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      padding: 3rem 2.25rem 2rem;
      text-align: center;
      box-shadow: 
        0 20px 45px -10px rgba(0, 0, 0, 0.06),
        0 1px 3px rgba(0, 0, 0, 0.04);
    }

    /* Clean Sun Icon */
    .icon-box {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: var(--amber-bg);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .icon-box svg {
      width: 40px;
      height: 40px;
      color: var(--amber);
      animation: rotate-sun 25s linear infinite;
    }

    @keyframes rotate-sun {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      color: #475569;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
      border: 1px solid #e2e8f0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--amber);
      border-radius: 50%;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.65;
      margin-bottom: 2rem;
    }

    /* Clean Button */
    .btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      width: 100%;
      max-width: 260px;
      padding: 0.85rem 1.6rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.2);
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.3);
    }

    .btn.loading svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .timer-note {
      color: var(--text-dim);
      font-size: 0.82rem;
      margin-top: 0.85rem;
    }

    .timer-note strong {
      color: var(--text-muted);
    }

    /* Subdued Footer */
    .footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid #f1f5f9;
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .cf-box {
      margin-top: 0.5rem;
      font-size: 0.72rem;
      color: #94a3b8;
      font-family: ui-monospace, monospace;
    }

    .cf-box * {
      color: inherit !important;
      font-size: inherit !important;
      background: transparent !important;
      border: none !important;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Icon -->
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </div>

    <div class="status-pill">
      <span class="status-dot"></span>
      Service Resting
    </div>

    <h1>Quazaar Sync is Paused</h1>
    <p>
      The service is currently resting or in sleep mode. Everything is safe and your connection will restore automatically.
    </p>

    <!-- Action -->
    <button id="btn" class="btn" onclick="retry()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      <span id="btnLabel">Check Status</span>
    </button>

    <div class="timer-note">
      Auto-reconnecting in <strong id="timer">15</strong> seconds
    </div>

    <!-- Quiet Cloudflare Footer -->
    <div class="footer">
      <div>quazaar-sync.codershubinc.com • Status 1033</div>
      <div class="cf-box">
        ::CLOUDFLARE_ERROR_1000S_BOX::
      </div>
    </div>
  </div>

  <script>
    let s = 15;
    const t = document.getElementById('timer');
    const b = document.getElementById('btn');
    const l = document.getElementById('btnLabel');

    const cd = setInterval(() => {
      s--;
      if (s <= 0) {
        clearInterval(cd);
        retry();
      } else {
        t.textContent = s;
      }
    }, 1000);

    function retry() {
      b.classList.add('loading');
      l.textContent = "Checking...";
      setTimeout(() => {
        try { (window.top || window).location.reload(); } catch(e) { window.location.reload(); }
      }, 350);
    }
  </script>
</body>
</html>
