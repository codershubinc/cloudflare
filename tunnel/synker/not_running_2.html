<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <noscript>
    <meta http-equiv="refresh" content="15" />
  </noscript>
  <title>Quazaar Sync — Taking a Nap</title>
  <style>
    :root {
      --bg: #0c1022;
      --card-bg: rgba(22, 29, 53, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --amber: #f59e0b;
      --amber-hover: #d97706;
      --indigo: #6366f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(99, 102, 241, 0.15), transparent 60%),
        radial-gradient(circle at 20% 80%, rgba(245, 158, 11, 0.06), transparent 50%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Ambient Twinkling Stars */
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0.3;
      animation: twinkle 3s infinite ease-in-out;
    }

    .star-1 { top: 18%; left: 22%; animation-delay: 0s; }
    .star-2 { top: 25%; right: 20%; animation-delay: 1.2s; }
    .star-3 { top: 75%; left: 15%; animation-delay: 2.1s; }
    .star-4 { top: 70%; right: 25%; animation-delay: 0.8s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.8; transform: scale(1.4); }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      max-width: 490px;
      width: 100%;
      padding: 3rem 2.25rem 2rem;
      text-align: center;
      position: relative;
      z-index: 10;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    }

    /* Sleeping Moon Illustration */
    .illustration-box {
      width: 110px;
      height: 110px;
      margin: 0 auto 1.5rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .moon-glow {
      position: absolute;
      width: 80px;
      height: 80px;
      background: rgba(245, 158, 11, 0.2);
      border-radius: 50%;
      filter: blur(20px);
    }

    .moon-svg {
      width: 70px;
      height: 70px;
      color: #fbbf24;
      animation: gentle-rock 4s ease-in-out infinite;
      transform-origin: center bottom;
    }

    @keyframes gentle-rock {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    /* Animated "Zzz" */
    .zzz {
      position: absolute;
      right: 12px;
      top: 5px;
      font-weight: 800;
      font-family: ui-rounded, -apple-system, sans-serif;
      color: #93c5fd;
      opacity: 0;
      animation: zzz-float 3s infinite ease-out;
    }

    .zzz-1 { animation-delay: 0s; font-size: 0.9rem; }
    .zzz-2 { animation-delay: 1s; font-size: 1.15rem; right: 2px; top: -10px; }

    @keyframes zzz-float {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      40% { opacity: 0.8; }
      100% { opacity: 0; transform: translate(12px, -22px) scale(1.1); }
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.65rem;
      color: #ffffff;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* Warm Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .btn-wake {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      border: none;
      width: 100%;
      max-width: 280px;
      padding: 0.9rem 1.6rem;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.35);
      transition: all 0.2s ease;
    }

    .btn-wake:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(245, 158, 11, 0.45);
    }

    .btn-wake.loading svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .auto-timer-note {
      color: #64748b;
      font-size: 0.82rem;
      margin-top: 0.5rem;
    }

    .auto-timer-note strong {
      color: #cbd5e1;
    }

    /* Footer */
    .foot-wrap {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--card-border);
      font-size: 0.76rem;
      color: #475569;
    }

    .cf-box {
      margin-top: 0.5rem;
      font-family: ui-monospace, monospace;
    }

    .cf-box * {
      color: inherit !important;
      font-size: inherit !important;
      background: transparent !important;
      border: none !important;
    }
  </style>
</head>
<body>
  <!-- Ambient background stars -->
  <div class="star star-1"></div>
  <div class="star star-2"></div>
  <div class="star star-3"></div>
  <div class="star star-4"></div>

  <div class="card">
    <!-- Friendly Illustration -->
    <div class="illustration-box">
      <div class="moon-glow"></div>
      <span class="zzz zzz-1">Z</span>
      <span class="zzz zzz-2">Z</span>
      <svg class="moon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        <path d="M19 3v4"></path>
        <path d="M21 5h-4"></path>
      </svg>
    </div>

    <h1>Taking a Short Nap</h1>
    <p>
      Quazaar Sync is resting while idle to save power. Don't worry — your data is safe and it will wake up shortly.
    </p>

    <!-- Friendly Action -->
    <div class="btn-group">
      <button id="wakeBtn" class="btn-wake" onclick="wakeUp()">
        <svg id="btnIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span id="btnLabel">Wake Up Service</span>
      </button>

      <div class="auto-timer-note">
        Checking connection in <strong id="countdown">15</strong> seconds
      </div>
    </div>

    <!-- Quiet Edge Error Reference -->
    <div class="foot-wrap">
      <div>quazaar-sync.codershubinc.com • Status 1033</div>
      <div class="cf-box">
        ::CLOUDFLARE_ERROR_1000S_BOX::
      </div>
    </div>
  </div>

  <script>
    let timeLeft = 15;
    const cd = document.getElementById('countdown');
    const btn = document.getElementById('wakeBtn');
    const btnLabel = document.getElementById('btnLabel');

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(timer);
        wakeUp();
      } else {
        cd.textContent = timeLeft;
      }
    }, 1000);

    function wakeUp() {
      btn.classList.add('loading');
      btnLabel.textContent = "Waking Up...";
      setTimeout(() => {
        try { (window.top || window).location.reload(); } catch(e) { window.location.reload(); }
      }, 350);
    }
  </script>
</body>
</html>
