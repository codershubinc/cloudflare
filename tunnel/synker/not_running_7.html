<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <noscript>
    <meta http-equiv="refresh" content="15" />
  </noscript>
  <title>Quazaar Sync — Coffee Break</title>
  <style>
    :root {
      --bg: #120e0a;
      --card-bg: #1c1611;
      --border: rgba(217, 119, 6, 0.15);
      --text: #fef3c7;
      --text-muted: #d4bda8;
      --text-dim: #8c7664;
      --coffee: #d97706;
      --coffee-hover: #b45309;
      --steam: rgba(254, 243, 199, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(217, 119, 6, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 50% 90%, rgba(180, 83, 9, 0.08) 0%, transparent 50%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      max-width: 480px;
      width: 100%;
      padding: 3rem 2.25rem 2rem;
      text-align: center;
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.7);
    }

    /* Steaming Coffee Cup Illustration */
    .cup-container {
      width: 90px;
      height: 90px;
      margin: 0 auto 1.5rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .steam-wrap {
      position: absolute;
      top: 4px;
      display: flex;
      gap: 7px;
    }

    .steam-line {
      width: 3px;
      height: 16px;
      background: var(--steam);
      border-radius: 3px;
      animation: rise 2.2s infinite ease-in-out;
    }

    .steam-line:nth-child(2) {
      animation-delay: 0.5s;
      height: 22px;
    }

    .steam-line:nth-child(3) {
      animation-delay: 1s;
    }

    @keyframes rise {
      0% { opacity: 0; transform: translateY(4px) scaleX(0.8); }
      50% { opacity: 0.8; transform: translateY(-6px) scaleX(1.2); }
      100% { opacity: 0; transform: translateY(-16px) scaleX(1.5); }
    }

    .cup-svg {
      width: 52px;
      height: 52px;
      color: var(--coffee);
      margin-top: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(217, 119, 6, 0.15);
      border: 1px solid rgba(217, 119, 6, 0.3);
      color: #fde68a;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: var(--coffee);
      border-radius: 50%;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.75rem;
      color: #fffbeb;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.65;
      margin-bottom: 2rem;
    }

    .btn-coffee {
      background: linear-gradient(135deg, #d97706, #b45309);
      color: #ffffff;
      border: none;
      width: 100%;
      max-width: 270px;
      padding: 0.85rem 1.6rem;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(217, 119, 6, 0.35);
      transition: all 0.2s ease;
    }

    .btn-coffee:hover {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(217, 119, 6, 0.45);
    }

    .btn-coffee.loading svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .timer-note {
      color: var(--text-dim);
      font-size: 0.82rem;
      margin-top: 0.85rem;
    }

    .timer-note strong {
      color: #fde68a;
    }

    .foot {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(217, 119, 6, 0.12);
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .cf-box {
      margin-top: 0.5rem;
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
    }

    .cf-box * {
      color: inherit !important;
      font-size: inherit !important;
      background: transparent !important;
      border: none !important;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Steaming Coffee Cup -->
    <div class="cup-container">
      <div class="steam-wrap">
        <div class="steam-line"></div>
        <div class="steam-line"></div>
        <div class="steam-line"></div>
      </div>
      <svg class="cup-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
        <line x1="6" y1="1" x2="6" y2="4"></line>
        <line x1="10" y1="1" x2="10" y2="4"></line>
        <line x1="14" y1="1" x2="14" y2="4"></line>
      </svg>
    </div>

    <div class="badge">
      <span class="badge-dot"></span>
      Coffee Break Mode
    </div>

    <h1>Taking a Quick Coffee Break</h1>
    <p>
      Quazaar Sync is pausing for a brief refresh. Grab a sip — your session is safe and we'll be right back before your cup cools down.
    </p>

    <button id="btn" class="btn-coffee" onclick="retry()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      <span id="btnLabel">Check Again</span>
    </button>

    <div class="timer-note">
      Automatically reconnecting in <strong id="cd">15</strong>s
    </div>

    <div class="foot">
      <div>quazaar-sync.codershubinc.com • Status 1033</div>
      <div class="cf-box">
        ::CLOUDFLARE_ERROR_1000S_BOX::
      </div>
    </div>
  </div>

  <script>
    let s = 15;
    const cdEl = document.getElementById('cd');
    const b = document.getElementById('btn');
    const l = document.getElementById('btnLabel');

    const interval = setInterval(() => {
      s--;
      if (s <= 0) {
        clearInterval(interval);
        retry();
      } else {
        cdEl.textContent = s;
      }
    }, 1000);

    function retry() {
      b.classList.add('loading');
      l.textContent = "Brewing connection...";
      setTimeout(() => {
        try { (window.top || window).location.reload(); } catch(e) { window.location.reload(); }
      }, 350);
    }
  </script>
</body>
</html>
