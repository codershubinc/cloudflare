<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <noscript>
    <meta http-equiv="refresh" content="15" />
  </noscript>
  <title>Quazaar Sync — Be Right Back</title>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: #0f1420;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --blue: #3b82f6;
      --blue-glow: rgba(59, 130, 246, 0.25);
      --cyan: #06b6d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.06) 0%, transparent 40%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* Split-screen horizontal card */
    .split-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      max-width: 820px;
      width: 100%;
      display: flex;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
    }

    /* Left Visual Panel */
    .visual-pane {
      flex: 0 0 340px;
      background: linear-gradient(145deg, #131b2e, #0c121f);
      border-right: 1px solid var(--card-border);
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
    }

    .visual-pane::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, var(--blue-glow) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .floating-graphic {
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.75rem;
      position: relative;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .pulse-ring {
      position: absolute;
      inset: -8px;
      border: 2px dashed rgba(56, 189, 248, 0.3);
      border-radius: 34px;
      animation: spin 30s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .graphic-svg {
      width: 52px;
      height: 52px;
      color: #38bdf8;
    }

    .pane-tag {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.25);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 0.5rem;
    }

    .pane-sub {
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    /* Right Content Pane */
    .content-pane {
      flex: 1;
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .greeting-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #f59e0b;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
      box-shadow: 0 0 10px #f59e0b;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.85rem;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.65;
      margin-bottom: 1.75rem;
    }

    .actions-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .btn-main {
      background: var(--blue);
      color: #ffffff;
      border: none;
      padding: 0.85rem 1.6rem;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.35);
    }

    .btn-main:hover {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.45);
    }

    .btn-main.loading svg {
      animation: spin 0.8s linear infinite;
    }

    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.8rem 1rem;
      border-radius: 12px;
      font-size: 0.82rem;
    }

    .timer-pill strong {
      color: #38bdf8;
    }

    /* Subdued Footer */
    .foot {
      padding-top: 1.25rem;
      border-top: 1px solid var(--card-border);
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .cf-box {
      margin-top: 0.5rem;
      font-size: 0.72rem;
      color: #475569;
      font-family: ui-monospace, monospace;
    }

    .cf-box * {
      color: inherit !important;
      font-size: inherit !important;
      background: transparent !important;
      border: none !important;
    }

    /* Responsive */
    @media (max-width: 760px) {
      .split-card {
        flex-direction: column;
      }
      .visual-pane {
        flex: auto;
        padding: 2.25rem 1.5rem;
        border-right: none;
        border-bottom: 1px solid var(--card-border);
      }
      .content-pane {
        padding: 2rem 1.5rem;
      }
      .actions-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-main, .timer-pill {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="split-card">
    <!-- Left Visual Panel -->
    <div class="visual-pane">
      <div class="floating-graphic">
        <div class="pulse-ring"></div>
        <svg class="graphic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </div>
      <div class="pane-tag">Quazaar Sync</div>
      <div class="pane-sub">Standby Mode</div>
    </div>

    <!-- Right Content Pane -->
    <div class="content-pane">
      <div class="greeting-badge">
        <span class="dot"></span>
        Currently Resting
      </div>
      <h1>We’ll be right back</h1>
      <p>
        The Quazaar Sync service is taking a brief pause or restarting. Everything is safe and it will automatically reconnect when ready.
      </p>

      <div class="actions-bar">
        <button id="retryBtn" class="btn-main" onclick="triggerRetry()">
          <svg id="btnIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span id="btnText">Check Now</span>
        </button>

        <div class="timer-pill">
          <span>Auto-checking in <strong id="timer">15</strong>s</span>
        </div>
      </div>

      <div class="foot">
        <div>quazaar-sync.codershubinc.com • Status 1033</div>
        <div class="cf-box">
          ::CLOUDFLARE_ERROR_1000S_BOX::
        </div>
      </div>
    </div>
  </div>

  <script>
    let sec = 15;
    const timerEl = document.getElementById('timer');
    const retryBtn = document.getElementById('retryBtn');
    const btnText = document.getElementById('btnText');

    const countdown = setInterval(() => {
      sec--;
      if (sec <= 0) {
        clearInterval(countdown);
        triggerRetry();
      } else {
        timerEl.textContent = sec;
      }
    }, 1000);

    function triggerRetry() {
      retryBtn.classList.add('loading');
      btnText.textContent = "Checking...";
      setTimeout(() => {
        try { (window.top || window).location.reload(); } catch(e) { window.location.reload(); }
      }, 350);
    }
  </script>
</body>
</html>
