<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <noscript>
    <meta http-equiv="refresh" content="15" />
  </noscript>
  <title>Quazaar Sync — Reconnecting</title>
  <style>
    :root {
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.7);
      --text-dim: rgba(255, 255, 255, 0.45);
      --glass: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #050508;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      position: relative;
      overflow: hidden;
    }

    /* Ambient animated Aurora Lights */
    .aurora-bg {
      position: absolute;
      inset: -50%;
      background: 
        radial-gradient(circle at 30% 30%, rgba(139, 92, 246, 0.25), transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(236, 72, 153, 0.2), transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(20, 184, 166, 0.25), transparent 40%);
      filter: blur(80px);
      animation: aurora 16s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes aurora {
      0% { transform: rotate(0deg) scale(1); }
      100% { transform: rotate(15deg) scale(1.15); }
    }

    .glass-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      max-width: 480px;
      width: 100%;
      padding: 3rem 2.25rem 2.25rem;
      text-align: center;
      position: relative;
      z-index: 10;
      box-shadow: 
        0 30px 70px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
    }

    .aurora-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(20, 184, 166, 0.3));
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
    }

    .aurora-icon svg {
      width: 38px;
      height: 38px;
      color: #ffffff;
    }

    .aurora-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }

    .dot-glow {
      width: 7px;
      height: 7px;
      background: #2dd4bf;
      border-radius: 50%;
      box-shadow: 0 0 10px #2dd4bf;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn-aurora {
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      color: #ffffff;
      border: none;
      width: 100%;
      max-width: 270px;
      padding: 0.9rem 1.6rem;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 25px rgba(139, 92, 246, 0.4);
      transition: all 0.2s ease;
    }

    .btn-aurora:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.55);
    }

    .btn-aurora.loading svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .timer-wrap {
      color: var(--text-dim);
      font-size: 0.82rem;
      margin-top: 0.75rem;
    }

    .timer-wrap strong {
      color: #ffffff;
    }

    .foot {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .cf-box {
      margin-top: 0.5rem;
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
    }

    .cf-box * {
      color: inherit !important;
      font-size: inherit !important;
      background: transparent !important;
      border: none !important;
    }
  </style>
</head>
<body>
  <div class="aurora-bg"></div>

  <div class="glass-card">
    <div class="aurora-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
      </svg>
    </div>

    <div class="aurora-badge">
      <span class="dot-glow"></span>
      Taking a Breather
    </div>

    <h1>Quazaar Sync is Idle</h1>
    <p>
      The local tunnel is resting while inactive. As soon as traffic arrives, it will wake up and resume sync automatically.
    </p>

    <button id="btn" class="btn-aurora" onclick="retry()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      <span id="btnLabel">Wake Up Service</span>
    </button>

    <div class="timer-wrap">
      Automatic check in <strong id="cd">15</strong>s
    </div>

    <div class="foot">
      <div>quazaar-sync.codershubinc.com • Status 1033</div>
      <div class="cf-box">
        ::CLOUDFLARE_ERROR_1000S_BOX::
      </div>
    </div>
  </div>

  <script>
    let sec = 15;
    const cdEl = document.getElementById('cd');
    const btn = document.getElementById('btn');
    const label = document.getElementById('btnLabel');

    const t = setInterval(() => {
      sec--;
      if (sec <= 0) {
        clearInterval(t);
        retry();
      } else {
        cdEl.textContent = sec;
      }
    }, 1000);

    function retry() {
      btn.classList.add('loading');
      label.textContent = "Connecting...";
      setTimeout(() => {
        try { (window.top || window).location.reload(); } catch(e) { window.location.reload(); }
      }, 350);
    }
  </script>
</body>
</html>
